<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100 дней AI — Программа обучения</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --black: #0a0a0a;
  --white: #ffffff;
  --gray-1: #f2f2f2;
  --gray-2: #b0b0b0;
  --gray-3: #444;
  --accent: #d8fb03;
  --green: #22c55e;
  --card: #121212;
  --border: #1e1e1e;
  --border2: #2a2a2a;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { font-family: 'Space Grotesk', Arial, sans-serif; background: var(--black); color: var(--white); min-height: 100vh; }

/* HEADER */
.header {
  padding: 18px 32px;
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; background: var(--black); z-index: 200;
  gap: 16px;
}
.logo { font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; white-space: nowrap; }
.logo span { color: var(--accent); }
.header-right { display: flex; align-items: center; gap: 20px; }
.progress-wrap { display: flex; align-items: center; gap: 12px; }
.progress-label { font-size: 12px; color: var(--gray-2); white-space: nowrap; }
.progress-bar-wrap { width: 140px; height: 3px; background: #222; border-radius: 2px; }
.progress-bar-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.4s; }
.progress-count { font-size: 13px; font-weight: 600; color: var(--accent); white-space: nowrap; }
.reset-btn { font-size: 11px; color: var(--gray-3); background: none; border: 1px solid #333; padding: 5px 12px; cursor: pointer; font-family: inherit; letter-spacing: 1px; text-transform: uppercase; transition: all 0.15s; }
.reset-btn:hover { border-color: #666; color: var(--gray-2); }
.header-nav { display: flex; align-items: center; gap: 24px; }
.header-nav-link { font-size: 12px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; color: var(--gray-2); text-decoration: none; transition: color 0.2s; }
.header-nav-link:hover { color: var(--accent); }

/* LAYOUT */
.layout { display: flex; height: calc(100vh - 57px); }

/* SIDEBAR */
.sidebar {
  width: 264px; flex-shrink: 0;
  border-right: 1px solid var(--border);
  overflow-y: auto; overflow-x: hidden;
}
.sidebar::-webkit-scrollbar { width: 4px; }
.sidebar::-webkit-scrollbar-track { background: transparent; }
.sidebar::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

.phase-group { border-bottom: 1px solid var(--border); }
.phase-toggle {
  padding: 14px 20px;
  display: flex; justify-content: space-between; align-items: center;
  cursor: pointer; transition: background 0.15s; user-select: none;
}
.phase-toggle:hover { background: #111; }
.phase-toggle-left { display: flex; flex-direction: column; gap: 3px; }
.phase-toggle-name { font-size: 12px; font-weight: 700; letter-spacing: 0.5px; }
.phase-toggle-range { font-size: 10px; color: var(--gray-2); letter-spacing: 2px; text-transform: uppercase; }
.phase-toggle-arrow { font-size: 10px; color: var(--gray-3); transition: transform 0.2s; }
.phase-group.open .phase-toggle-arrow { transform: rotate(180deg); }
.phase-mini-progress { display: flex; gap: 3px; margin-top: 6px; }
.mini-dot { width: 6px; height: 6px; border-radius: 50%; background: #2a2a2a; transition: background 0.3s; }
.mini-dot.done { background: var(--accent); }

.lessons-nav { display: none; }
.phase-group.open .lessons-nav { display: block; }
.nav-item {
  padding: 10px 20px 10px 28px;
  cursor: pointer;
  border-left: 2px solid transparent;
  transition: all 0.15s;
  display: flex; align-items: flex-start; gap: 10px;
}
.nav-item:hover { background: #0e0e0e; border-left-color: #333; }
.nav-item.active { background: #111500; border-left-color: var(--accent); }
.nav-check {
  width: 16px; height: 16px; flex-shrink: 0; margin-top: 2px;
  border: 1px solid #333; border-radius: 2px;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; transition: all 0.2s;
}
.nav-check.done { background: var(--green); border-color: var(--green); color: #fff; }
.nav-text { flex: 1; }
.nav-title { font-size: 12px; line-height: 1.4; }
.nav-days { font-size: 10px; color: var(--gray-2); margin-top: 2px; }

/* MAIN */
.main { flex: 1; overflow-y: auto; overflow-x: hidden; }
.main::-webkit-scrollbar { width: 6px; }
.main::-webkit-scrollbar-track { background: transparent; }
.main::-webkit-scrollbar-thumb { background: #222; border-radius: 3px; }

/* WELCOME */
.welcome-screen { max-width: 700px; margin: 0 auto; padding: 64px 48px; }
.welcome-eyebrow { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); margin-bottom: 20px; }
.welcome-title { font-size: 48px; font-weight: 700; line-height: 1.1; margin-bottom: 20px; }
.welcome-sub { font-size: 17px; color: var(--gray-2); line-height: 1.7; margin-bottom: 48px; }
.welcome-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); margin-bottom: 48px; }
.stat-box { background: var(--black); padding: 24px 20px; }
.stat-num { font-size: 36px; font-weight: 700; color: var(--accent); }
.stat-label { font-size: 12px; color: var(--gray-2); margin-top: 4px; }
.welcome-phases { display: flex; flex-direction: column; gap: 8px; }
.welcome-phase-card {
  border: 1px solid var(--border2);
  padding: 18px 24px;
  display: flex; justify-content: space-between; align-items: center;
  cursor: pointer; transition: all 0.15s;
}
.welcome-phase-card:hover { border-color: var(--accent); background: #0d0d00; }
.wpc-left h3 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.wpc-left p { font-size: 13px; color: var(--gray-2); }
.wpc-right { display: flex; align-items: center; gap: 12px; }
.wpc-days { font-size: 12px; color: var(--gray-2); white-space: nowrap; }
.wpc-arrow { color: var(--accent); font-size: 18px; }

/* LESSON DETAIL */
.lesson-view { max-width: 760px; margin: 0 auto; padding: 48px 48px 80px; }
.lesson-eyebrow {
  display: flex; align-items: center; gap: 12px;
  font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent);
  margin-bottom: 16px;
}
.lesson-eyebrow-sep { color: #333; }
.lesson-title { font-size: 38px; font-weight: 700; line-height: 1.15; margin-bottom: 20px; }
.lesson-meta { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 40px; }
.meta-badge {
  background: #1a1a1a; border: 1px solid #2a2a2a;
  padding: 5px 14px; font-size: 12px; color: var(--gray-2);
  letter-spacing: 0.5px;
}
.meta-tool { background: #0d0d00; border: 1px solid #2a2a00; color: #aaa; }

/* STEPS */
.steps { display: flex; flex-direction: column; gap: 16px; margin-bottom: 40px; }
.step-card { border: 1px solid var(--border2); position: relative; overflow: hidden; }
.step-header { padding: 0 28px; display: flex; align-items: center; gap: 16px; height: 52px; border-bottom: 1px solid var(--border); }
.step-num { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; padding: 4px 12px; }
.step-1 .step-num { background: var(--accent); color: var(--black); }
.step-2 .step-num { background: #fff; color: var(--black); }
.step-3 .step-num { background: var(--green); color: #fff; }
.step-title { font-size: 15px; font-weight: 600; }
.step-body { padding: 24px 28px; font-size: 15px; color: var(--gray-2); line-height: 1.7; }
.step-body strong { color: var(--white); font-weight: 600; }
.step-body ul { padding-left: 20px; margin-top: 8px; }
.step-body li { margin-bottom: 6px; }
.step-body p + p { margin-top: 10px; }

/* RESOURCES */
.section-label { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--gray-2); margin-bottom: 16px; }
.resources-block { border: 1px solid var(--border2); background: #0d0d0d; padding: 24px 28px; margin-bottom: 24px; }
.resource-row { display: flex; align-items: flex-start; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.resource-row:last-child { border-bottom: none; padding-bottom: 0; }
.res-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
.res-info strong { font-size: 14px; font-weight: 600; display: block; margin-bottom: 2px; }
.res-info span { font-size: 13px; color: var(--gray-2); }

/* BLOG */
.blog-block { border: 1px solid #2a2700; background: #0f0e00; padding: 24px 28px; margin-bottom: 40px; }
.blog-eyebrow { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
.blog-post-title { font-size: 20px; font-weight: 600; line-height: 1.4; }

/* COMPLETE */
.complete-wrap { display: flex; gap: 12px; }
.btn-complete {
  flex: 1; padding: 16px 32px;
  background: var(--accent); color: var(--black);
  border: none; font-family: inherit; font-size: 13px; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase;
  cursor: pointer; transition: all 0.15s;
}
.btn-complete:hover { background: #c8eb00; }
.btn-complete.completed { background: var(--green); color: #fff; }
.btn-complete.completed:hover { background: #1ab050; }
.btn-prev, .btn-next {
  padding: 16px 24px;
  background: transparent; color: var(--gray-2);
  border: 1px solid #333; font-family: inherit; font-size: 13px;
  cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.btn-prev:hover, .btn-next:hover { border-color: #666; color: var(--white); }
.btn-prev:disabled, .btn-next:disabled { opacity: 0.2; cursor: not-allowed; }

/* MOBILE */
.sidebar-toggle { display: none; background: #1a1a1a; border: 1px solid #333; color: var(--white); padding: 8px 16px; font-family: inherit; font-size: 12px; cursor: pointer; letter-spacing: 1px; text-transform: uppercase; }
.mobile-sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 150; }
.sidebar.mobile-open { display: flex !important; flex-direction: column; position: fixed; left: 0; top: 0; bottom: 0; z-index: 160; background: var(--black); width: 280px; }

@media (max-width: 768px) {
  .header { padding: 14px 20px; }
  .header-right { gap: 12px; }
  .progress-bar-wrap { width: 80px; }
  .reset-btn { display: none; }
  .header-nav { display: none; }
  .layout { height: auto; flex-direction: column; }
  .sidebar { display: none; width: 100%; height: auto; max-height: none; border-right: none; border-bottom: 1px solid var(--border); }
  .main { overflow: visible; }
  .welcome-screen { padding: 32px 20px; }
  .welcome-title { font-size: 32px; }
  .welcome-stats { grid-template-columns: repeat(3, 1fr); }
  .stat-num { font-size: 28px; }
  .lesson-view { padding: 32px 20px 60px; }
  .lesson-title { font-size: 28px; }
  .step-body { padding: 20px; }
  .step-header { padding: 0 20px; }
  .sidebar-toggle { display: block; margin: 12px 20px; }
  .complete-wrap { flex-direction: column; }
}
</style>
</head>
<body>

<header class="header">
  <div class="logo">100 дней <span>AI</span></div>
  <div class="header-nav">
    <a href="roadmap.html" class="header-nav-link">Roadmap</a>
    <a href="commands.html" class="header-nav-link">Команды</a>
  </div>
  <div class="header-right">
    <div class="progress-wrap">
      <span class="progress-label">Пройдено</span>
      <div class="progress-bar-wrap"><div class="progress-bar-fill" id="headerProgress" style="width:0%"></div></div>
      <span class="progress-count" id="headerCount">0 / 32</span>
    </div>
    <button class="reset-btn" onclick="resetProgress()">Сброс</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main"></main>
</div>

<script>
const PHASES = [
  {
    id: 1,
    name: "Основы и автоматизации",
    days: "Дни 1–20",
    tools: "Claude, ChatGPT, Make.com",
    color: "#d8fb03"
  },
  {
    id: 2,
    name: "Telegram-боты и CRM",
    days: "Дни 21–40",
    tools: "Make.com, ManyChat, AmoCRM",
    color: "#d8fb03"
  },
  {
    id: 3,
    name: "n8n и сложные сценарии",
    days: "Дни 41–60",
    tools: "n8n, Airtable, Notion, API",
    color: "#d8fb03"
  },
  {
    id: 4,
    name: "AI-контент и визуал",
    days: "Дни 61–80",
    tools: "Midjourney, Runway, Kling, HeyGen",
    color: "#d8fb03"
  },
  {
    id: 5,
    name: "Первые продажи и масштаб",
    days: "Дни 81–100",
    tools: "Всё вместе",
    color: "#d8fb03"
  }
];

const LESSONS = [
  // PHASE 1
  {
    id: 1, phase: 1,
    days: "1–2", title: "Промпт-инжиниринг",
    tools: ["Claude", "ChatGPT"],
    steps: [
      {
        label: "Изучи",
        body: `<p>Промпт — это не просто вопрос, это <strong>техническое задание для AI</strong>. Качество ответа на 80% зависит от того, как ты спросил.</p>
<p>Три главных принципа хорошего промпта:</p>
<ul>
<li><strong>Роль</strong> — скажи кто ты и кто AI: «Ты — опытный маркетолог»</li>
<li><strong>Контекст</strong> — дай фон: «У меня кофейня в Москве, 50 мест»</li>
<li><strong>Формат</strong> — скажи что хочешь получить: «Дай список из 5 пунктов»</li>
</ul>`
      },
      {
        label: "Сделай",
        body: `<p>Открой Claude или ChatGPT и напиши один и тот же запрос тремя способами:</p>
<ul>
<li>Плохо: <strong>«Напиши текст для сайта»</strong></li>
<li>Лучше: <strong>«Напиши текст для главной страницы кофейни»</strong></li>
<li>Отлично: <strong>«Ты — копирайтер для малого бизнеса. Напиши короткий (3 предложения) текст для главной страницы уютной кофейни в центре Москвы. Тон — тёплый, без пафоса. Аудитория — офисные сотрудники 25–40 лет.»</strong></li>
</ul>
<p>Сравни результаты. Сохрани лучший промпт как шаблон.</p>`
      },
      {
        label: "Результат",
        body: `<p>У тебя есть <strong>личный шаблон промпта</strong> из трёх частей: роль + контекст + формат.</p>
<p>Ты понимаешь разницу между «спросить» и «поставить задачу». Это основа всего что будет дальше.</p>`
      }
    ],
    resources: [
      { icon: "📖", title: "Документация Claude", desc: "Раздел Prompt Engineering на сайте Anthropic — бесплатно" },
      { icon: "🎥", title: "YouTube: «Prompt Engineering Guide»", desc: "Ищи по запросу — много хороших бесплатных видео" },
      { icon: "💬", title: "Практика", desc: "claude.ai или chatgpt.com — просто открой и пробуй" }
    ],
    blog: "День 1: оказывается, как ты спрашиваешь — так тебе и отвечают"
  },
  {
    id: 2, phase: 1,
    days: "3–4", title: "Claude для бизнеса",
    tools: ["Claude"],
    steps: [
      {
        label: "Изучи",
        body: `<p>Claude отлично справляется с деловыми задачами: <strong>ответы на вопросы клиентов, шаблоны писем, анализ текстов, генерация идей</strong>.</p>
<p>Ключевой приём — <strong>System Prompt</strong>: инструкция которую AI получает до разговора. Это превращает Claude в специализированного ассистента для твоего бизнеса.</p>`
      },
      {
        label: "Сделай",
        body: `<p>Возьми реальный список из 5–10 частых вопросов от клиентов (своих или знакомого бизнеса). Напиши для Claude системный промпт:</p>
<ul>
<li>«Ты — консультант компании [название]. Отвечаешь на вопросы клиентов кратко и по делу. Не придумывай факты.»</li>
<li>Затем задай эти вопросы и посмотри на ответы</li>
<li>Улучши промпт если нужно, добавь конкретики</li>
</ul>
<p>Задокументируй итоговый промпт — это уже готовый продукт.</p>`
      },
      {
        label: "Результат",
        body: `<p><strong>Готовый бот-консультант</strong> на базе Claude для конкретного бизнеса. Умеет отвечать на 5–10 частых вопросов клиентов.</p>
<p>Пусть пока это только в интерфейсе Claude — завтра ты научишься это автоматизировать.</p>`
      }
    ],
    resources: [
      { icon: "📖", title: "System Prompts в Claude", desc: "Раздел «Build with Claude» на docs.anthropic.com" },
      { icon: "💡", title: "Идея", desc: "Попроси знакомого владельца бизнеса дать список FAQ — это готовый кейс для портфолио" }
    ],
    blog: "Сделал бота-консультанта за 2 часа без кода"
  },
  {
    id: 3, phase: 1,
    days: "5–7", title: "Make.com — первые сценарии",
    tools: ["Make.com"],
    steps: [
      {
        label: "Изучи",
        body: `<p>Make.com (бывший Integromat) — это визуальный конструктор автоматизации. Ты соединяешь приложения как лего-блоки.</p>
<p>Три базовых понятия:</p>
<ul>
<li><strong>Сценарий</strong> — цепочка действий</li>
<li><strong>Триггер</strong> — событие которое запускает сценарий (новая строка, письмо, заявка)</li>
<li><strong>Модуль</strong> — одно действие (отправить письмо, добавить строку, послать уведомление)</li>
</ul>`
      },
      {
        label: "Сделай",
        body: `<p><strong>День 5:</strong> Зарегистрируйся на make.com, изучи интерфейс. Посмотри готовые шаблоны.</p>
<p><strong>День 6:</strong> Создай первый сценарий: <strong>Gmail → Google Sheets</strong>. Когда приходит письмо с темой «Заявка» — добавляй строку в таблицу. Бесплатные модули, работает сразу.</p>
<p><strong>День 7:</strong> Запусти тест, отправь себе письмо. Убедись что строка появилась в таблице. Разберись с форматированием данных.</p>`
      },
      {
        label: "Результат",
        body: `<p><strong>Первый работающий автоматический сценарий.</strong> Письмо пришло — данные автоматически попали в таблицу.</p>
<p>Ты понимаешь логику триггер → действие. Это шаблон для любой автоматизации.</p>`
      }
    ],
    resources: [
      { icon: "🌐", title: "make.com", desc: "Бесплатный план — 1000 операций/месяц, достаточно для старта" },
      { icon: "🎥", title: "YouTube: «Make.com tutorial for beginners»", desc: "Официальный канал Make — русских субтитров нет, но интерфейс понятен визуально" },
      { icon: "📚", title: "Make Academy", desc: "academy.make.com — бесплатные курсы от команды Make" }
    ],
    blog: "Make.com — это лего для бизнеса. Первый сценарий за вечер"
  },
  {
    id: 4, phase: 1,
    days: "8–10", title: "Make + Google Sheets",
    tools: ["Make.com", "Google Sheets"],
    steps: [
      {
        label: "Изучи",
        body: `<p>Google Sheets — идеальная база данных для малого бизнеса на старте: бесплатно, понятно, работает как CRM.</p>
<p>Make умеет: <strong>добавлять строки, обновлять ячейки, искать данные, читать таблицы</strong> — это основа большинства простых автоматизаций.</p>`
      },
      {
        label: "Сделай",
        body: `<p>Создай Google Form для сбора заявок (имя, телефон, вопрос). Подключи Make:</p>
<ul>
<li><strong>Триггер:</strong> Новый ответ в Google Forms</li>
<li><strong>Действие 1:</strong> Записать данные в Google Sheets (лист «Заявки»)</li>
<li><strong>Действие 2:</strong> Обновить ячейку «Статус» значением «Новая»</li>
</ul>
<p>Заполни форму тестово 3–5 раз. Проверь что все данные корректно попадают в таблицу.</p>`
      },
      {
        label: "Результат",
        body: `<p><strong>Система сбора заявок:</strong> форма → автоматически в таблицу. Ни одна заявка не потеряется.</p>
<p>Это реальный продукт который стоит денег. Любой малый бизнес платит за это решение.</p>`
      }

// State
let progress = JSON.parse(localStorage.getItem('curriculum_progress') || '{}');
let currentLesson = null;

function isCompleted(id) { return !!progress[id]; }

function totalCompleted() { return Object.keys(progress).filter(k => progress[k]).length; }

function updateHeaderProgress() {
  const total = LESSONS.length;
  const done = totalCompleted();
  const pct = Math.round(done / total * 100);
  document.getElementById('headerProgress').style.width = pct + '%';
  document.getElementById('headerCount').textContent = done + ' / ' + total;
}

function resetProgress() {
  if (confirm('Сбросить весь прогресс?')) {
    progress = {};
    localStorage.removeItem('curriculum_progress');
    renderSidebar();
    updateHeaderProgress();
    showWelcome();
  }
}

function toggleLesson(id) {
  progress[id] = !progress[id];
  if (!progress[id]) delete progress[id];
  localStorage.setItem('curriculum_progress', JSON.stringify(progress));
  renderSidebar();
  updateHeaderProgress();
  if (currentLesson) {
    const btn = document.getElementById('completeBtn');
    if (btn) {
      btn.textContent = isCompleted(currentLesson) ? '✓ Выполнено' : 'Отметить выполненным';
      btn.className = 'btn-complete' + (isCompleted(currentLesson) ? ' completed' : '');
    }
  }
}

function getLessonsForPhase(phaseId) {
  return LESSONS.filter(l => l.phase === phaseId);
}

function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = PHASES.map(phase => {
    const lessons = getLessonsForPhase(phase.id);
    const doneCount = lessons.filter(l => isCompleted(l.id)).length;
    const isOpen = currentLesson && LESSONS.find(l => l.id === currentLesson)?.phase === phase.id;
    return `
      <div class="phase-group${isOpen ? ' open' : ''}" id="phase-group-${phase.id}">
        <div class="phase-toggle" onclick="togglePhase(${phase.id})">
          <div class="phase-toggle-left">
            <div class="phase-toggle-name">Фаза ${phase.id}: ${phase.name}</div>
            <div class="phase-toggle-range">${phase.days}</div>
            <div class="phase-mini-progress">
              ${lessons.map(l => `<div class="mini-dot${isCompleted(l.id) ? ' done' : ''}"></div>`).join('')}
            </div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
            <div style="font-size:10px;color:var(--gray-2)">${doneCount}/${lessons.length}</div>
            <div class="phase-toggle-arrow">▼</div>
          </div>
        </div>
        <div class="lessons-nav">
          ${lessons.map(l => `
            <div class="nav-item${currentLesson === l.id ? ' active' : ''}" onclick="openLesson(${l.id})">
              <div class="nav-check${isCompleted(l.id) ? ' done' : ''}">${isCompleted(l.id) ? '✓' : ''}</div>
              <div class="nav-text">
                <div class="nav-title">${l.title}</div>
                <div class="nav-days">Дни ${l.days}</div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }).join('');
}

function togglePhase(id) {
  const el = document.getElementById('phase-group-' + id);
  el.classList.toggle('open');
}

function showWelcome() {
  currentLesson = null;
  renderSidebar();
  const main = document.getElementById('main');
  const totalDone = totalCompleted();
  main.innerHTML = `
    <div class="welcome-screen">
      <div class="welcome-eyebrow">ПРОГРАММА ОБУЧЕНИЯ</div>
      <h1 class="welcome-title">100 дней AI<br>и автоматизации</h1>
      <p class="welcome-sub">От нуля до первых платных клиентов на автоматизацию бизнеса. Каждый блок — конкретные шаги: изучи, сделай, получи результат.</p>
      <div class="welcome-stats">
        <div class="stat-box">
          <div class="stat-num">32</div>
          <div class="stat-label">блока уроков</div>
        </div>
        <div class="stat-box">
          <div class="stat-num">5</div>
          <div class="stat-label">фаз обучения</div>
        </div>
        <div class="stat-box">
          <div class="stat-num">${totalDone}</div>
          <div class="stat-label">пройдено</div>
        </div>
      </div>
      <div class="welcome-phases">
        ${PHASES.map(p => {
          const lessons = getLessonsForPhase(p.id);
          const done = lessons.filter(l => isCompleted(l.id)).length;
          return `
          <div class="welcome-phase-card" onclick="openFirstLesson(${p.id})">
            <div class="wpc-left">
              <h3>Фаза ${p.id}: ${p.name}</h3>
              <p>${p.tools} · ${done}/${lessons.length} пройдено</p>
            </div>
            <div class="wpc-right">
              <span class="wpc-days">${p.days}</span>
              <span class="wpc-arrow">→</span>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>
  `;
}

function openFirstLesson(phaseId) {
  const lessons = getLessonsForPhase(phaseId);
  if (lessons.length) openLesson(lessons[0].id);
}

function openLesson(id) {
  currentLesson = id;
  const lesson = LESSONS.find(l => l.id === id);
  if (!lesson) return;
  renderSidebar();
  const phase = PHASES.find(p => p.id === lesson.phase);
  const idx = LESSONS.findIndex(l => l.id === id);
  const prev = LESSONS[idx - 1];
  const next = LESSONS[idx + 1];
  const done = isCompleted(id);

  const stepsHtml = lesson.steps.map((step, i) => `
    <div class="step-card step-${i+1}">
      <div class="step-header">
        <div class="step-num">Шаг ${i+1}</div>
        <div class="step-title">${step.label}</div>
      </div>
      <div class="step-body">${step.body}</div>
    </div>
  `).join('');

  const resourcesHtml = lesson.resources.length ? `
    <div class="resources-block">
      <div class="section-label">Ресурсы</div>
      ${lesson.resources.map(r => `
        <div class="resource-row">
          <div class="res-icon">${r.icon}</div>
          <div class="res-info">
            <strong>${r.title}</strong>
            <span>${r.desc}</span>
          </div>
        </div>
      `).join('')}
    </div>
  ` : '';

  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="lesson-view">
      <div class="lesson-eyebrow">
        Фаза ${phase.id}<span class="lesson-eyebrow-sep">·</span>${phase.name}
      </div>
      <h1 class="lesson-title">${lesson.title}</h1>
      <div class="lesson-meta">
        <div class="meta-badge">Дни ${lesson.days}</div>
        ${lesson.tools.map(t => `<div class="meta-badge meta-tool">${t}</div>`).join('')}
      </div>
      <div class="steps">${stepsHtml}</div>
      ${resourcesHtml}
      <div class="blog-block">
        <div class="blog-eyebrow">📝 Пост в блог</div>
        <div class="blog-post-title">"${lesson.blog}"</div>
      </div>
      <div class="complete-wrap">
        <button ${prev ? '' : 'disabled'} class="btn-prev" onclick="openLesson(${prev?.id})">← Назад</button>
        <button id="completeBtn" class="btn-complete${done ? ' completed' : ''}" onclick="toggleLesson(${id})">
          ${done ? '✓ Выполнено' : 'Отметить выполненным'}
        </button>
        <button ${next ? '' : 'disabled'} class="btn-next" onclick="openLesson(${next?.id})">Вперёд →</button>
      </div>
    </div>
  `;
  main.scrollTop = 0;
}

// Init
updateHeaderProgress();
renderSidebar();
showWelcome();
</script>
